# GitHub Actions CI for a standalone Magento 2 module.
#
# Runs on every push and pull request to main.
# Does NOT require Magento repo credentials for the static analysis jobs.
# Unit tests are disabled by default — see the "unit-tests" job below for
# instructions on enabling them with Magento repo auth.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Static Analysis ─────────────────────────────────────────────────────────
  # Installs only open-source QA tools (no Magento repo credentials needed).
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, bcmath, soap
          tools: composer:v2
          coverage: none

      # Validate the module's own composer.json (no install needed).
      - name: Validate composer.json
        run: composer validate --no-check-publish

      # Install QA tools in an isolated directory so we don't try to resolve
      # magento/framework (which requires repo.magento.com credentials).
      - name: Install QA tools
        run: |
          mkdir -p /tmp/qa-tools
          cat > /tmp/qa-tools/composer.json << 'EOF'
          {
            "require": {
              "magento/magento-coding-standard": ">=28",
              "phpmd/phpmd": "^2.15"
            },
            "config": {
              "allow-plugins": {
                "dealerdirect/phpcodesniffer-composer-installer": true
              }
            }
          }
          EOF
          composer install \
            --working-dir=/tmp/qa-tools \
            --no-progress \
            --prefer-dist \
            --no-interaction

      - name: PHP CodeSniffer (Magento2 standard)
        run: |
          /tmp/qa-tools/vendor/bin/phpcs \
            --standard=Magento2 \
            --extensions=php \
            --ignore=vendor/ \
            --runtime-set ignore_warnings_on_exit 1 \
            .

      # PROVENANCE.md records a SHA-256 for the vendored accessible-menu bundle and asks that it be
      # updated in the same commit as the blob. Without this, a swapped blob is indistinguishable
      # from a legitimate bump. The package is in no manifest either, so no SCA or Dependabot
      # advisory would ever reach it. Ported from Muon_TopMenu in 2.2.0, when this package became
      # the single owner of the bundle.
      - name: Verify vendored JS checksum
        run: |
          cd view/frontend/web/js/vendor
          recorded="$(grep -oiE '\b[a-f0-9]{64}\b' PROVENANCE.md | head -1)"
          if [ -z "$recorded" ]; then
            echo "::error::No SHA-256 found in PROVENANCE.md"; exit 1
          fi
          actual="$(sha256sum accessible-menu-top-link-disclosure.iife.js | cut -d' ' -f1)"
          if [ "$recorded" != "$actual" ]; then
            echo "::error::Vendored bundle does not match PROVENANCE.md"
            echo "  recorded: $recorded"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "Vendored bundle matches PROVENANCE.md ($actual)"

      - name: PHPMD
        run: |
          # Test/ is excluded deliberately: PHPMD's MissingImport and CouplingBetweenObjects
          # rules fire constantly on legitimate test code (inline \DateTimeImmutable, wide
          # collaborator mocking) and would fail the build for zero production defects.
          /tmp/qa-tools/vendor/bin/phpmd . ansi \
            phpmd.xml \
            --exclude vendor/,Test/

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  # Disabled by default because Magento framework classes are required at
  # runtime and magento/framework lives behind repo.magento.com authentication.
  #
  # To enable:
  #   1. Add two GitHub Actions secrets holding your repo.magento.com keys —
  #      MAGENTO_COMPOSER_AUTH_USER (public key) and
  #      MAGENTO_COMPOSER_AUTH_PASS (private key). The step below passes them to
  #      `composer config http-basic.repo.magento.com`.
  #   2. Uncomment the job below.
  #   3. Add require-dev to the module's composer.json:
  #        "require-dev": {
  #            "magento/magento2-base": "^2.4",
  #            "phpunit/phpunit": "^10.5"
  #        }
  #
  # unit-tests:
  #   name: Unit Tests
  #   runs-on: ubuntu-latest
  #   needs: static-analysis
  #
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #
  #     - name: Set up PHP 8.3
  #       uses: shivammathur/setup-php@v2
  #       with:
  #         php-version: '8.3'
  #         extensions: intl, zip, bcmath, soap
  #         tools: composer:v2
  #         coverage: none
  #
